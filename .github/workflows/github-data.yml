name: Update GitHub Data

on:
  schedule:
    - cron: "0 */6 * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-data
  cancel-in-progress: false

jobs:
  update-github-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate GitHub data
        run: npm run generate:github
        env:
          GITHUB_USERNAME: Facelessism
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit updated data
        run: |
          if git diff --quiet -- src/generated/github.json; then
            echo "GitHub data is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add src/generated/github.json

          git commit -m "chore: update GitHub data"

          git push
