<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" role="img" aria-labelledby="ms-t ms-d">
  <title id="ms-t">MyScroll emblem</title>
  <desc id="ms-d">A stylized rolled scroll with a spiral emblem, metallic detailing and a hanging tassel.</desc>
  <defs>
    <linearGradient id="ms-body" x1="25" y1="18" x2="103" y2="111" gradientUnits="userSpaceOnUse">
