      <stop offset="1" stop-color="#181a27"/>
    </linearGradient>
    <linearGradient id="ms-metal" x1="26" y1="25" x2="104" y2="99" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f6e2a6"/>
      <stop offset=".35" stop-color="#b88a45"/>
      <stop offset=".7" stop-color="#e8c77b"/>
      <stop offset="1" stop-color="#6f4d24"/>
    </linearGradient>
    <linearGradient id="ms-hi" x1="38" y1="31" x2="87" y2="94" gradientUnits="userSpaceOnUse">
